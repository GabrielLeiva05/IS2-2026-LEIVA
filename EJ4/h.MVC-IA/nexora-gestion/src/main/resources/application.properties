# ==============================================================================
# application.properties — Configuración de la aplicación Spring Boot
# ==============================================================================
# Este archivo es leído automáticamente por Spring Boot al arrancar. Cada
# propiedad "spring.*" es procesada por la auto-configuración correspondiente
# (DataSource, JPA/Hibernate, Thymeleaf, servidor Tomcat embebido, etc.)
# ==============================================================================

# --- Nombre de la aplicación (aparece en logs) ---
spring.application.name=nexora-gestion

# --- Puerto del servidor Tomcat embebido ---
server.port=8080

# ==============================================================================
# DATASOURCE (conexión física a MySQL)
# ==============================================================================
# Si usás el docker-compose.yml incluido en la raíz del proyecto, estos
# valores por defecto YA FUNCIONAN sin cambiar nada (ver README.md).
# Si te conectás a un MySQL propio, ajustá host/puerto/usuario/clave.
#
# allowPublicKeyRetrieval=true: MySQL 8 usa por defecto el plugin de
# autenticación "caching_sha2_password", que necesita intercambiar una clave
# pública RSA con el cliente. Sin este parámetro (y sin SSL activo), el
# driver rechaza la conexión con el error "Public Key Retrieval is not
# allowed". Es seguro habilitarlo en desarrollo local; en producción se
# recomienda usar SSL en su lugar.
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/nexora_gestion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=nexora
spring.datasource.password=nexora
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA / HIBERNATE (ORM)
# ==============================================================================
# ddl-auto=update: Hibernate compara las entidades @Entity contra las tablas
# existentes y crea/ajusta automáticamente el esquema. Ideal para desarrollo
# y para probar este proyecto rápidamente sin escribir scripts SQL a mano.
# En un entorno productivo real se recomienda "validate" + migraciones
# versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Dialecto específico de MySQL 8 (genera SQL óptimo para ese motor).
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Muestra en consola el SQL generado por Hibernate — muy útil para
# entender/depurar cómo el ORM traduce las operaciones JPA a SQL real.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita el warning de "open-in-view" (antipatrón de mantener la sesión de
# Hibernate abierta durante el renderizado de la vista); en su lugar, cada
# Service se encarga explícitamente de traer los datos que la vista necesita.
spring.jpa.open-in-view=false

# ==============================================================================
# THYMELEAF (Vista)
# ==============================================================================
# En desarrollo, cache=false permite editar los .html y ver los cambios sin
# reiniciar la aplicación (junto con spring-boot-devtools).
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.org.springframework.web=INFO
logging.level.com.nexora.gestion=DEBUG
