# ============================================================================
# application.yml - Configuración central de Spring Boot
# ============================================================================
# Los valores sensibles (usuario/clave de BD) se leen de variables de entorno
# con un valor por defecto (":") para que funcionen tanto corriendo la app
# localmente con Maven como dentro de Docker (ver docker-compose.yml).
# ============================================================================

server:
  port: 8080

spring:
  application:
    name: furnish-erp

  # --------------------------------------------------------------------
  # DATASOURCE: conexión JDBC a MySQL (contenedor levantado con docker-compose)
  # --------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:furnish_erp}?useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USER:furnish_user}
    password: ${DB_PASSWORD:furnish_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Pool de conexiones (HikariCP, incluido por defecto en Spring Boot)
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # --------------------------------------------------------------------
  # JPA / Hibernate (ORM): mapea las entidades @Entity a tablas MySQL
  # --------------------------------------------------------------------
  jpa:
    hibernate:
      # "update": Hibernate crea/actualiza automáticamente las tablas en base
      # a las entidades. Cómodo para desarrollo; en un entorno productivo real
      # se recomendaría usar herramientas de migración como Flyway/Liquibase.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false   # Evita el anti-patrón "Open Session In View": las
                           # consultas lazy deben resolverse en la capa Service,
                           # nunca de manera implícita en la vista.

  # --------------------------------------------------------------------
  # THYMELEAF (Vista)
  # --------------------------------------------------------------------
  thymeleaf:
    cache: false            # false en desarrollo para ver cambios sin reiniciar
    encoding: UTF-8
    mode: HTML

  # --------------------------------------------------------------------
  # Manejo de errores propios (redirige a /error y usamos GlobalExceptionHandler)
  # --------------------------------------------------------------------
  mvc:
    problemdetails:
      enabled: false

  messages:
    encoding: UTF-8

# ----------------------------------------------------------------------
# Logging: se sube el nivel de SQL en el paquete de la app para debug local
# ----------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.furnish.erp: DEBUG
    org.springframework.security: INFO

# ----------------------------------------------------------------------
# Datos de arranque: usuario administrador inicial creado por DataInitializer
# (ver com.furnish.erp.config.DataInitializer). Se puede sobrescribir por
# variables de entorno para no dejar credenciales fijas en el código.
# ----------------------------------------------------------------------
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
