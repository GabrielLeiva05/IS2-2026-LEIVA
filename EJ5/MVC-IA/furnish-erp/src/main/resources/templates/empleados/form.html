<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(titulo='Empleado')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 px-0" th:replace="~{layout/base :: sidebar(activo='empleados')}"></div>
        <div class="col-lg-10 col-md-9 px-0">
            <div th:replace="~{layout/base :: topbar(titulo=${empleado.idEmpleado} != null ? 'Editar empleado' : 'Nuevo empleado')}"></div>

            <div class="p-4">
                <div class="card border-0 shadow-sm" style="max-width:640px;">
                    <div class="card-body">
                        <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
                            <input type="hidden" th:field="*{idEmpleado}"/>

                            <div class="mb-3">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">DNI</label>
                                <input type="number" class="form-control" th:field="*{dni}"
                                       th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{dni}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email" class="form-control" th:field="*{correo}"
                                       th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{correo}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Cargo</label>
                                <input type="text" class="form-control" th:field="*{cargo}"
                                       th:classappend="${#fields.hasErrors('cargo')} ? 'is-invalid'"
                                       placeholder="Ej: Encargado de depósito, Comprador, etc."/>
                                <div class="invalid-feedback" th:errors="*{cargo}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                            <a th:href="@{/empleados}" class="btn btn-outline-secondary">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
