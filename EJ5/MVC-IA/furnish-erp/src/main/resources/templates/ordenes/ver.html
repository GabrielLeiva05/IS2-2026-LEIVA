<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head(titulo='Orden de Compra #' + ${orden.idOrdenCompra})}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 px-0" th:replace="~{layout/base :: sidebar(activo='ordenes')}"></div>
        <div class="col-lg-10 col-md-9 px-0">
            <div th:replace="~{layout/base :: topbar(titulo='Orden de Compra #' + ${orden.idOrdenCompra})}"></div>
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="p-4">
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="text-muted small">Fecha de emisión</div>
                                <div th:text="${#temporals.format(orden.fechaEmision, 'dd/MM/yyyy')}">01/01/2026</div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-muted small">Proveedor</div>
                                <div th:text="${orden.proveedor.nombre}">Proveedor</div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-muted small">Empleado</div>
                                <div th:text="${orden.empleado.nombre}">Empleado</div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-muted small">Estado</div>
                                <span class="badge" th:classappend="'badge-estado-' + ${orden.estado}" th:text="${orden.estado}">PENDIENTE</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h6 class="card-title">Productos</h6>
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio unitario</th>
                                <th>Subtotal</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="d : ${orden.detalles}">
                                <td th:text="${d.producto.nombre}">Producto</td>
                                <td th:text="${d.cantidadProducto}">1</td>
                                <td th:text="${'$' + #numbers.formatDecimal(d.precioUnitario, 1, 2)}">$0.00</td>
                                <td th:text="${'$' + #numbers.formatDecimal(d.subtotalLinea, 1, 2)}">$0.00</td>
                            </tr>
                            </tbody>
                            <tfoot>
                            <tr>
                                <th colspan="3" class="text-end">Subtotal</th>
                                <th th:text="${'$' + #numbers.formatDecimal(orden.subtotal, 1, 2)}">$0.00</th>
                            </tr>
                            <tr>
                                <th colspan="3" class="text-end">Precio total</th>
                                <th th:text="${'$' + #numbers.formatDecimal(orden.precioTotal, 1, 2)}">$0.00</th>
                            </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <!--/* Acciones de cambio de estado (máquina de estados que valida
                     OrdenCompraService.cambiarEstado). Solo se muestran las
                     transiciones válidas desde el estado actual. */-->
                <div class="card border-0 shadow-sm" th:if="${orden.estado.name() != 'RECIBIDA' and orden.estado.name() != 'CANCELADA'}">
                    <div class="card-body d-flex gap-2">
                        <form th:if="${orden.estado.name() == 'PENDIENTE'}" th:action="@{/ordenes/estado/{id}(id=${orden.idOrdenCompra})}" method="post">
                            <input type="hidden" name="nuevoEstado" value="APROBADA"/>
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check2"></i> Aprobar orden</button>
                        </form>
                        <form th:if="${orden.estado.name() == 'APROBADA'}" th:action="@{/ordenes/estado/{id}(id=${orden.idOrdenCompra})}" method="post">
                            <input type="hidden" name="nuevoEstado" value="RECIBIDA"/>
                            <button type="submit" class="btn btn-primary btn-sm"
                                    onclick="return confirm('Al recibir la orden se incrementará el stock de cada producto. ¿Confirmar?');">
                                <i class="bi bi-box-arrow-in-down"></i> Marcar como recibida
                            </button>
                        </form>
                        <form th:action="@{/ordenes/estado/{id}(id=${orden.idOrdenCompra})}" method="post">
                            <input type="hidden" name="nuevoEstado" value="CANCELADA"/>
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('¿Cancelar esta orden de compra?');">
                                <i class="bi bi-x-circle"></i> Cancelar orden
                            </button>
                        </form>
                    </div>
                </div>

                <a th:href="@{/ordenes}" class="btn btn-outline-secondary btn-sm mt-3">
                    <i class="bi bi-arrow-left"></i> Volver al listado
                </a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
