<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(titulo='Usuarios')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 px-0" th:replace="~{layout/base :: sidebar(activo='usuarios')}"></div>
        <div class="col-lg-10 col-md-9 px-0">
            <div th:replace="~{layout/base :: topbar(titulo='Usuarios del sistema')}"></div>
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small" th:text="${#lists.size(usuarios)} + ' usuario(s)'"></span>
                    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg"></i> Nuevo usuario
                    </a>
                </div>

                <div class="table-responsive card border-0 shadow-sm">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Empleado vinculado</th>
                            <th>Habilitado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.idUsuario}">1</td>
                            <td th:text="${u.username}">usuario</td>
                            <td><span class="badge bg-dark" th:text="${u.rol}">ADMIN</span></td>
                            <td th:text="${u.empleado != null ? u.empleado.nombre : '-'}">-</td>
                            <td>
                                <i class="bi bi-check-circle-fill text-success" th:if="${u.habilitado}"></i>
                                <i class="bi bi-x-circle-fill text-danger" th:unless="${u.habilitado}"></i>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-outline-dark">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}" method="post" class="d-inline"
                                      th:attr="onsubmit=|return confirm('¿Eliminar el usuario &quot;${u.username}&quot;?');|">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
