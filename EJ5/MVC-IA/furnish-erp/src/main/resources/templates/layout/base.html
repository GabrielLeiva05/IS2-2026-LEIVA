<!--
  ============================================================================
  layout/base.html
  ============================================================================
  Este archivo NO es una página en sí misma: es un contenedor de FRAGMENTOS
  Thymeleaf reutilizables (th:fragment) que las demás vistas incluyen con
  th:replace / th:insert. Es el equivalente, en Thymeleaf "vanilla" (sin la
  librería adicional thymeleaf-layout-dialect), a una plantilla maestra:
    - fragment "head"    -> <head> común (título dinámico, CSS, favicon).
    - fragment "sidebar"  -> menú lateral de navegación (resalta la sección activa).
    - fragment "topbar"   -> barra superior con el usuario logueado y logout.
  ============================================================================
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--/* Fragmento de <head>: recibe el título de página como parámetro */-->
    <th:block th:fragment="head(titulo)">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title th:text="${titulo} + ' - Furnish ERP'">Furnish ERP</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
        <link rel="stylesheet" th:href="@{/css/custom.css}"/>
    </th:block>

    <!--/* Fragmento de scripts (se incluye al final del body de cada página) */-->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</head>
<body>

<!--/* ==========================================================
     Fragmento SIDEBAR: recibe cuál es la sección activa (string)
     para resaltar el link correspondiente con la clase "active".
     sec:authorize="hasRole('ADMIN')" oculta el link de Usuarios a
     quienes no tengan el rol ADMIN.
     ========================================================== */-->
<nav class="sidebar d-flex flex-column p-0" th:fragment="sidebar(activo)">
    <div class="px-3 mb-3">
        <span class="brand-furnish text-white d-block">Furnish<small class="text-white-50">ERP · Gestión de Compras</small></span>
    </div>
    <div class="sidebar-heading">Principal</div>
    <a class="nav-link" th:classappend="${activo == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <div class="sidebar-heading">Gestión</div>
    <a class="nav-link" th:classappend="${activo == 'empleados'} ? 'active'" th:href="@{/empleados}">
        <i class="bi bi-person-badge"></i> Empleados
    </a>
    <a class="nav-link" th:classappend="${activo == 'proveedores'} ? 'active'" th:href="@{/proveedores}">
        <i class="bi bi-truck"></i> Proveedores
    </a>
    <a class="nav-link" th:classappend="${activo == 'productos'} ? 'active'" th:href="@{/productos}">
        <i class="bi bi-box-seam"></i> Productos
    </a>

    <div class="sidebar-heading">Compras &amp; Stock</div>
    <a class="nav-link" th:classappend="${activo == 'ordenes'} ? 'active'" th:href="@{/ordenes}">
        <i class="bi bi-cart-check"></i> Órdenes de Compra
    </a>
    <a class="nav-link" th:classappend="${activo == 'stock'} ? 'active'" th:href="@{/stock}">
        <i class="bi bi-boxes"></i> Stock
    </a>

    <div class="sidebar-heading" sec:authorize="hasRole('ADMIN')">Administración</div>
    <a class="nav-link" sec:authorize="hasRole('ADMIN')"
       th:classappend="${activo == 'usuarios'} ? 'active'" th:href="@{/usuarios}">
        <i class="bi bi-people"></i> Usuarios
    </a>
</nav>

<!--/* ==========================================================
     Fragmento TOPBAR: muestra el título de la sección, el usuario
     autenticado (sec:authentication) y el botón de logout. El
     logout se envía por POST con el token CSRF (obligatorio, ya
     que la protección CSRF está habilitada en SecurityConfig).
     ========================================================== */-->
<div th:fragment="topbar(titulo)" class="navbar-custom d-flex justify-content-between align-items-center px-4 py-3">
    <h5 class="mb-0" th:text="${titulo}">Título de sección</h5>
    <div class="d-flex align-items-center gap-3">
        <span class="text-muted small">
            <i class="bi bi-person-circle"></i>
            <span sec:authentication="name">usuario</span>
            <span class="badge bg-dark ms-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
            <span class="badge bg-secondary ms-1" sec:authorize="hasRole('EMPLEADO')">EMPLEADO</span>
        </span>
        <form th:action="@{/logout}" method="post" class="mb-0">
            <button type="submit" class="btn btn-sm btn-outline-dark">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </form>
    </div>
</div>

<!--/* ==========================================================
     Fragmento de mensajes flash (éxito) seteados por los
     controladores vía RedirectAttributes.addFlashAttribute.
     ========================================================== */-->
<div th:fragment="flash" th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show m-4 mb-0" role="alert">
    <i class="bi bi-check-circle"></i> <span th:text="${mensajeExito}">Operación exitosa</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

</body>
</html>
