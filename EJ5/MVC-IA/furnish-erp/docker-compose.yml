# ==============================================================================
# docker-compose.yml
# ==============================================================================
# Levanta dos servicios:
#   1) mysql -> base de datos MySQL (imagen oficial mysql:latest) con un
#      volumen para persistir los datos entre reinicios.
#   2) app   -> la aplicación Spring Boot (Furnish ERP), construida a partir
#      del Dockerfile de este mismo repositorio.
#
# Uso:
#   docker compose up -d --build     # levanta MySQL + la aplicación
#   docker compose logs -f app       # ver logs de la aplicación
#   docker compose down              # detener todo (los datos persisten)
#   docker compose down -v           # detener y BORRAR también los datos
#
# La aplicación queda disponible en http://localhost:8080
# ==============================================================================
services:

  mysql:
    image: mysql:latest
    container_name: furnish-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: furnish_erp
      MYSQL_USER: furnish_user
      MYSQL_PASSWORD: furnish_pass
    ports:
      - "3306:3306"
    volumes:
      - furnish_erp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: furnish-erp-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: furnish_erp
      DB_USER: furnish_user
      DB_PASSWORD: furnish_pass
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  furnish_erp_mysql_data:
