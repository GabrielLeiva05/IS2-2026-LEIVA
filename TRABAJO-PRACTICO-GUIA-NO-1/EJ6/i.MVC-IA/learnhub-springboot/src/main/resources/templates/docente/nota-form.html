<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar nota | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="card border-0 shadow-sm p-4">
    <h1 class="h4">Editar nota</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{'/docente/nota/' + ${nota.id} + '/editar'}" th:object="${nota}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" th:field="*{materiaId}">
      <label class="form-label">Fecha</label>
      <input class="form-control mb-3" type="date" th:field="*{fecha}">
      <div class="error-text" th:errors="*{fecha}"></div>
      <label class="form-label">Valor (0 a 10)</label>
      <input class="form-control mb-3" type="number" step="0.01" min="0" max="10" th:field="*{valor}">
      <div class="error-text" th:errors="*{valor}"></div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Guardar cambios</button>
        <a class="btn btn-outline-secondary" th:href="@{/docente/materias}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body></html>
