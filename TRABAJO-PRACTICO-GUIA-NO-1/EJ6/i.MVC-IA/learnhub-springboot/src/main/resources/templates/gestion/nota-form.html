<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${nota.id} != null ? 'Editar nota' : 'Nueva nota'">Nota</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="card p-4">
    <h1 class="h4" th:text="${nota.id} != null ? 'Editar nota' : 'Nueva nota'">Nota</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{${accion}}" th:object="${nota}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label class="form-label">Materia</label>
      <select class="form-select mb-3" th:field="*{materiaId}">
        <option value="">Seleccionar</option>
        <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"></option>
      </select>
      <div class="error-text" th:errors="*{materiaId}"></div>

      <label class="form-label">Fecha</label>
      <input class="form-control mb-3" type="date" th:field="*{fecha}">
      <div class="error-text" th:errors="*{fecha}"></div>

      <label class="form-label">Valor (0 a 10)</label>
      <input class="form-control" type="number" step="0.01" min="0" max="10" th:field="*{valor}">
      <div class="error-text" th:errors="*{valor}"></div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" th:href="@{/gestion/materias}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body></html>
