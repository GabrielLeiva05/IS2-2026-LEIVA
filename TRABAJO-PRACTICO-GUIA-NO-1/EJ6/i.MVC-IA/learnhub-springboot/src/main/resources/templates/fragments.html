<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white shadow-sm sticky-top"><div class="container">
<a class="navbar-brand d-inline-flex gap-2 align-items-center fw-bold" th:href="@{/}"><span class="text-primary">📚</span> LearnHub</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div id="nav" class="collapse navbar-collapse"><ul class="navbar-nav mx-auto"><li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li><li class="nav-item" th:if="${#authorization.expression('hasRole(''DOCENTE'')')}"><a class="nav-link" th:href="@{/docente/perfil}">Mi perfil</a></li><li class="nav-item" th:if="${#authorization.expression('hasRole(''DOCENTE'')')}"><a class="nav-link" th:href="@{/docente/materias}">Mis materias</a></li><li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}"><a class="nav-link" th:href="@{/gestion}">Gestión</a></li></ul>
<div class="d-flex gap-2"><a class="btn btn-outline-primary" th:href="@{/login}" th:unless="${#authorization.expression('isAuthenticated()')}">Ingresar</a><a class="btn btn-primary" th:href="@{/registro}" th:unless="${#authorization.expression('isAuthenticated()')}">Registrarme</a><form th:if="${#authorization.expression('isAuthenticated()')}" th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary" type="submit">Salir</button></form></div>
</div></div></nav>
<footer th:fragment="footer" class="footer border-top py-4"><div class="container text-center text-muted">LearnHub · Spring Boot MVC · Thymeleaf · JPA/Hibernate · MySQL · Security · Envers</div></footer>
</body></html>
