<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Materias | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold">Materias</h1>
      <p class="text-muted mb-0">Cada materia vincula un profesor con un alumno.</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/gestion/materia/nueva}">Nueva materia</a>
      <a class="btn btn-outline-secondary" th:href="@{/gestion}">&larr; Volver a gestión</a>
    </div>
  </div>

  <div class="card p-4">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Nombre</th><th>Profesor</th><th>Alumno</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody>
          <tr th:each="m : ${materias}">
            <td th:text="${m.nombre}"></td>
            <td th:text="${nombresProfesores[m.profesorId]}"></td>
            <td th:text="${nombresAlumnos[m.alumnoId]}"></td>
            <td>
              <span class="badge bg-success" th:unless="${m.eliminado}">Activa</span>
              <span class="badge bg-secondary" th:if="${m.eliminado}">Dada de baja</span>
            </td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/materia/' + ${m.id} + '/notas'}">Notas</a>
              <a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/materia/' + ${m.id} + '/editar'}">Editar</a>
              <a class="btn btn-sm btn-outline-secondary" th:href="@{'/admin/auditoria/materia/' + ${m.id}}">Auditoría</a>
              <form class="d-inline" th:if="${!m.eliminado}" th:action="@{'/gestion/materia/' + ${m.id} + '/eliminar'}" method="post"
                    onsubmit="return confirm('¿Dar de baja esta materia?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(materias)}"><td colspan="5" class="text-muted text-center">Todavía no hay materias registradas.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body></html>
