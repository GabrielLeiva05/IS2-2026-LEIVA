<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profesores | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold">Profesores</h1>
      <p class="text-muted mb-0">El alta se realiza desde la pantalla pública de registro.</p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/gestion}">&larr; Volver a gestión</a>
  </div>

  <div class="card p-4">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Nombre</th><th>Especialidad</th><th>Usuario</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody>
          <tr th:each="p : ${profesores}">
            <td th:text="${p.nombre + ' ' + p.apellido}"></td>
            <td th:text="${p.especialidad}"></td>
            <td th:text="${p.email}"></td>
            <td>
              <span class="badge bg-success" th:unless="${p.eliminado}">Activo</span>
              <span class="badge bg-secondary" th:if="${p.eliminado}">Dado de baja</span>
            </td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/profesor/' + ${p.id} + '/materias'}">Materias</a>
              <a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/profesor/' + ${p.id} + '/editar'}">Editar</a>
              <a class="btn btn-sm btn-outline-secondary" th:href="@{'/admin/auditoria/profesor/' + ${p.id}}">Auditoría</a>
              <form class="d-inline" th:if="${!p.eliminado}" th:action="@{'/gestion/profesor/' + ${p.id} + '/eliminar'}" method="post"
                    onsubmit="return confirm('¿Dar de baja a este profesor?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(profesores)}"><td colspan="5" class="text-muted text-center">Todavía no hay profesores registrados.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body></html>
