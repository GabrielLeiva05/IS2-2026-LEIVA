<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aulas | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold" th:text="'Aulas de ' + ${grado.nivel}"></h1>
      <p class="text-muted mb-0">Composición Grado &rarr; Aula.</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/gestion/aula/nueva(gradoId=${grado.id})}">Nueva aula</a>
      <a class="btn btn-outline-secondary" th:href="@{/gestion/grados}">&larr; Volver a grados</a>
    </div>
  </div>

  <div class="card p-4">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>División</th><th>Alumnos</th><th class="text-end">Acciones</th></tr></thead>
        <tbody>
          <tr th:each="a : ${aulas}">
            <td th:text="${a.division}"></td>
            <td th:text="${a.cantidadAlumnos}"></td>
            <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/aula/' + ${a.id}}">Ver detalle</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(aulas)}"><td colspan="3" class="text-muted text-center">Este grado todavía no tiene aulas.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body></html>
