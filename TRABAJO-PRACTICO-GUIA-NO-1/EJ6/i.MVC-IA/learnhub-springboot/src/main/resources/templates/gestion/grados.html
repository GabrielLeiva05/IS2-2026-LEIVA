<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grados | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold">Grados</h1>
      <p class="text-muted mb-0">Cada grado agrupa sus aulas por composición.</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/gestion/grado/nuevo}">Nuevo grado</a>
      <a class="btn btn-outline-secondary" th:href="@{/gestion}">&larr; Volver a gestión</a>
    </div>
  </div>

  <div class="card p-4">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Nivel</th><th class="text-end">Acciones</th></tr></thead>
        <tbody>
          <tr th:each="g : ${grados}">
            <td th:text="${g.nivel}"></td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/grado/' + ${g.id} + '/aulas'}">Ver aulas</a>
              <a class="btn btn-sm btn-outline-primary" th:href="@{/gestion/aula/nueva(gradoId=${g.id})}">Nueva aula</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(grados)}"><td colspan="2" class="text-muted text-center">Todavía no hay grados registrados.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body></html>
