<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auditoría | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><h1 class="h3">Historial de auditoría</h1><p class="text-muted">Revisiones generadas por Hibernate Envers.</p><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Entidad</th><th>ID</th><th>Revisión</th><th>Fecha</th><th>Usuario</th><th>Operación</th></tr></thead><tbody><tr th:each="h : ${historial}"><td th:text="${h.entidad}"></td><td th:text="${h.idEntidad}"></td><td th:text="${h.revision}"></td><td th:text="${h.fecha}"></td><td th:text="${h.usuario}"></td><td th:text="${h.operacion}"></td></tr></tbody></table></div></main></body></html>
