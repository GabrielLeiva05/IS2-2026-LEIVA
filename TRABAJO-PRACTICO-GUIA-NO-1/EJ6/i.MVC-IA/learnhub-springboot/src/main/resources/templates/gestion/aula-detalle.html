<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aula | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold" th:text="'Aula ' + ${aula.division} + ' — ' + ${grado.nivel}"></h1>
      <p class="text-muted mb-0" th:text="${aula.cantidadAlumnos} + ' alumno(s) asociado(s)'"></p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{'/gestion/grado/' + ${grado.id} + '/aulas'}">&larr; Volver a aulas</a>
  </div>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card p-4 h-100">
        <h2 class="h5">Alumnos del aula</h2>
        <table class="table">
          <thead><tr><th>Nombre</th><th>Fecha nacimiento</th></tr></thead>
          <tbody>
            <tr th:each="al : ${alumnosDelAula}">
              <td th:text="${al.nombre + ' ' + al.apellido}"></td>
              <td th:text="${al.fechaNacimiento}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(alumnosDelAula)}"><td colspan="2" class="text-muted text-center">Todavía no hay alumnos en esta aula.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card p-4 h-100">
        <h2 class="h5">Asociar alumno</h2>
        <form th:action="@{'/gestion/aula/' + ${aula.id} + '/alumnos'}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="form-label">Alumno activo</label>
          <select class="form-select mb-3" name="alumnoId" required>
            <option value="">Seleccionar</option>
            <option th:each="al : ${alumnosDisponibles}" th:value="${al.id}" th:text="${al.nombre + ' ' + al.apellido}"></option>
          </select>
          <button class="btn btn-primary w-100" th:disabled="${#lists.isEmpty(alumnosDisponibles)}">Asociar</button>
          <p class="text-muted small mt-2" th:if="${#lists.isEmpty(alumnosDisponibles)}">No hay alumnos activos disponibles para asociar.</p>
        </form>
      </div>
    </div>
  </div>
</main>
</body></html>
