# ============================================================
# LEARNHUB - Spring Boot MVC + Thymeleaf + JPA + MySQL
# ============================================================
spring.application.name=learnhub
server.port=${SERVER_PORT:8080}

# La contraseña de MySQL nunca se versiona: se obtiene de DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnhub?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Mendoza&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ORM / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.hibernate.envers.store_data_at_delete=true

# Thymeleaf
spring.thymeleaf.cache=false

# Seguridad de sesión
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ============================================================
# ADMIN INICIAL (opcional)
# Sólo se crea si ambas variables están definidas.
# ============================================================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ============================================================
# SMTP - correo de bienvenida
# Para Gmail/SMTP real configurar estas variables de entorno.
# ============================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
