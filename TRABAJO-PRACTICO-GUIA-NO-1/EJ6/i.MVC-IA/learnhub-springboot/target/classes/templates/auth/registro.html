<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro docente | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="~{fragments :: navbar}"></div><main class="form-shell container"><div class="card shadow-sm border-0 p-4"><h1 class="h3 fw-bold">Registro de docente</h1><p class="text-muted">El correo personal será tu usuario de acceso.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/registro}" th:object="${registro}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}"><div class="error-text" th:errors="*{nombre}"></div></div>
<div class="col-md-6"><label class="form-label">Apellido</label><input class="form-control" th:field="*{apellido}"><div class="error-text" th:errors="*{apellido}"></div></div>
<div class="col-md-6"><label class="form-label">Especialidad</label><input class="form-control" th:field="*{especialidad}"><div class="error-text" th:errors="*{especialidad}"></div></div>
<div class="col-md-6"><label class="form-label">Sexo</label><select class="form-select" th:field="*{sexo}"><option value="">Seleccionar</option><option th:each="s : ${T(com.learnhub.enumeration.Sexo).values()}" th:value="${s}" th:text="${s}"></option></select><div class="error-text" th:errors="*{sexo}"></div></div>
<div class="col-md-6"><label class="form-label">Fecha de nacimiento</label><input class="form-control" type="date" th:field="*{fechaNacimiento}"><div class="error-text" th:errors="*{fechaNacimiento}"></div></div>
<div class="col-md-6"><label class="form-label">Correo personal</label><input class="form-control" type="email" th:field="*{email}" autocomplete="email"><div class="error-text" th:errors="*{email}"></div></div>
<div class="col-md-6"><label class="form-label">Contraseña</label><input class="form-control" type="password" th:field="*{password}" minlength="8" autocomplete="new-password"><div class="error-text" th:errors="*{password}"></div></div>
<div class="col-md-6"><label class="form-label">Repetir contraseña</label><input class="form-control" type="password" th:field="*{confirmPassword}" autocomplete="new-password"><div class="error-text" th:errors="*{confirmPassword}"></div></div>
</div><button class="btn btn-primary w-100 mt-4" type="submit">Crear cuenta</button></form></div></main></body></html>
