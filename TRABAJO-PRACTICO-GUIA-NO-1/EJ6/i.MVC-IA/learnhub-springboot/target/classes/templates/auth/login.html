<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ingresar | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: navbar}"></div><main class="auth-shell container"><div class="card shadow-sm border-0 p-4"><h1 class="h3 fw-bold">Ingresar</h1><p class="text-muted">Usá tu correo personal y contraseña.</p><div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos.</div><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Correo personal</label><input class="form-control" type="email" name="username" required autocomplete="email"></div><div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary w-100" type="submit">Ingresar</button></form><p class="mt-4 mb-0 text-center">¿No tenés cuenta? <a th:href="@{/registro}">Registrate</a></p></div></main></body></html>
