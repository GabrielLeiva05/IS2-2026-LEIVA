<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi perfil | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 fw-bold">Mi perfil</h1><p class="text-muted">Datos del profesor y cuenta de acceso.</p></div><div class="d-flex gap-2"><a class="btn btn-primary" th:href="@{/docente/editar}">Editar datos</a><a class="btn btn-outline-primary" th:href="@{/docente/password}">Cambiar contraseña</a></div></div><div th:if="${param.actualizado}" class="alert alert-success">Perfil actualizado correctamente.</div><div class="card border-0 shadow-sm p-4"><dl class="row mb-0"><dt class="col-sm-4">Nombre</dt><dd class="col-sm-8" th:text="${profesor.nombre}"></dd><dt class="col-sm-4">Apellido</dt><dd class="col-sm-8" th:text="${profesor.apellido}"></dd><dt class="col-sm-4">Especialidad</dt><dd class="col-sm-8" th:text="${profesor.especialidad}"></dd><dt class="col-sm-4">Sexo</dt><dd class="col-sm-8" th:text="${profesor.sexo}"></dd><dt class="col-sm-4">Fecha de nacimiento</dt><dd class="col-sm-8" th:text="${profesor.fechaNacimiento}"></dd><dt class="col-sm-4">Usuario</dt><dd class="col-sm-8" th:text="${profesor.email}"></dd></dl></div></main></body></html>
