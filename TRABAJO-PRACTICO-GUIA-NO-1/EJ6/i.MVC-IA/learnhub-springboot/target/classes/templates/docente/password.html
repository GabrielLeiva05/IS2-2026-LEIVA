<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cambiar contraseña | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: navbar}"></div><main class="auth-shell container"><div class="card shadow-sm border-0 p-4"><h1 class="h3 fw-bold">Cambiar contraseña</h1><div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/docente/password}" th:object="${cambioPassword}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Contraseña actual</label><input class="form-control" type="password" th:field="*{passwordActual}" required></div><div class="mb-3"><label class="form-label">Nueva contraseña</label><input class="form-control" type="password" th:field="*{nuevaPassword}" minlength="8" required><div class="error-text" th:errors="*{nuevaPassword}"></div></div><div class="mb-3"><label class="form-label">Confirmar nueva contraseña</label><input class="form-control" type="password" th:field="*{confirmarNuevaPassword}" required></div><button class="btn btn-primary w-100">Actualizar contraseña</button></form></div></main></body></html>
