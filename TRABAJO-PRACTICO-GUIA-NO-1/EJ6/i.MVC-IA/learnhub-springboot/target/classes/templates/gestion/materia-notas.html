<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notas | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold" th:text="'Notas de ' + ${materia.nombre}"></h1>
      <p class="text-muted mb-0" th:text="'Profesor: ' + ${nombreProfesor} + ' · Alumno: ' + ${nombreAlumno}"></p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/gestion/materias}">&larr; Volver a materias</a>
  </div>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card p-4 h-100">
        <h2 class="h5">Historial de notas</h2>
        <table class="table">
          <thead><tr><th>Fecha</th><th>Valor</th><th></th></tr></thead>
          <tbody>
            <tr th:each="n : ${notas}">
              <td th:text="${n.fecha}"></td>
              <td th:text="${n.valor}"></td>
              <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/nota/' + ${n.id} + '/editar'}">Editar</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(notas)}"><td colspan="3" class="text-muted text-center">Todavía no hay notas cargadas.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card p-4 h-100">
        <h2 class="h5">Nueva nota</h2>
        <form th:action="@{/gestion/nota}" th:object="${nota}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" th:field="*{materiaId}">
          <label class="form-label">Fecha</label>
          <input class="form-control mb-3" type="date" th:field="*{fecha}">
          <div class="error-text" th:errors="*{fecha}"></div>
          <label class="form-label">Valor (0 a 10)</label>
          <input class="form-control mb-3" type="number" step="0.01" min="0" max="10" th:field="*{valor}">
          <div class="error-text" th:errors="*{valor}"></div>
          <button class="btn btn-primary w-100">Guardar nota</button>
        </form>
      </div>
    </div>
  </div>
</main>
</body></html>
