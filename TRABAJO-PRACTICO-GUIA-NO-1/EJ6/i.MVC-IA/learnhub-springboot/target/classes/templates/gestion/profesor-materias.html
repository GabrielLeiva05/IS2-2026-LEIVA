<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Materias dictadas | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold">Materias dictadas</h1>
      <p class="text-muted mb-0" th:text="${profesor.nombre + ' ' + profesor.apellido + ' — ' + profesor.especialidad}"></p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/gestion/profesores}">&larr; Volver a profesores</a>
  </div>

  <div class="card p-4">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Materia</th><th>Alumno</th><th></th></tr></thead>
        <tbody>
          <tr th:each="m : ${materias}">
            <td th:text="${m.nombre}"></td>
            <td th:text="${nombresAlumnos[m.alumnoId]}"></td>
            <td><a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/materia/' + ${m.id} + '/notas'}">Ver notas</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(materias)}"><td colspan="3" class="text-muted text-center">Este profesor todavía no dicta materias.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body></html>
