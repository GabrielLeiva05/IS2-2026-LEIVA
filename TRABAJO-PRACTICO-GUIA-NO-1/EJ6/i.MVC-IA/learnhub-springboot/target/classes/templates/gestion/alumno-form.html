<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${alumno.id} != null ? 'Editar alumno' : 'Nuevo alumno'">Alumno</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="card p-4">
    <h1 class="h4" th:text="${alumno.id} != null ? 'Editar alumno' : 'Nuevo alumno'">Alumno</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{${accion}}" th:object="${alumno}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="eliminado" value="false">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input class="form-control" th:field="*{nombre}">
          <div class="error-text" th:errors="*{nombre}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Apellido</label>
          <input class="form-control" th:field="*{apellido}">
          <div class="error-text" th:errors="*{apellido}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Fecha de nacimiento</label>
             <input class="form-control" type="date" id="fechaNacimiento" name="fechaNacimiento"
               th:value="${alumno.fechaNacimiento != null ? #temporals.format(alumno.fechaNacimiento, 'yyyy-MM-dd') : ''}">
          <div class="error-text" th:errors="*{fechaNacimiento}"></div>
        </div>
      </div>

      <div class="mt-4">
        <label class="form-label d-block">Aulas asociadas</label>
        <p class="text-muted small">Relación Aula-Alumno del diagrama (muchos a muchos).</p>
        <div class="row">
          <div class="col-md-4 form-check" th:each="aula : ${todasLasAulas}">
            <input class="form-check-input" type="checkbox" th:field="*{aulaIds}" th:value="${aula.id}">
            <label class="form-check-label" th:for="${#ids.prev('aulaIds')}"
                   th:text="${aula.division} + ' — ' + ${nombresGrados[aula.gradoId]}"></label>
          </div>
        </div>
        <p class="text-muted small" th:if="${#lists.isEmpty(todasLasAulas)}">Todavía no hay aulas creadas.</p>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" th:href="@{/gestion/alumnos}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body></html>
