<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${materia.id} != null ? 'Editar materia' : 'Nueva materia'">Materia</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="card p-4">
    <h1 class="h4" th:text="${materia.id} != null ? 'Editar materia' : 'Nueva materia'">Materia</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{${accion}}" th:object="${materia}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="eliminado" value="false">
      <label class="form-label">Nombre</label>
      <input class="form-control mb-3" th:field="*{nombre}">
      <div class="error-text" th:errors="*{nombre}"></div>

      <label class="form-label">Profesor</label>
      <select class="form-select mb-3" th:field="*{profesorId}">
        <option value="">Seleccionar</option>
        <option th:each="p : ${profesores}" th:value="${p.id}" th:text="${p.nombre + ' ' + p.apellido}"></option>
      </select>
      <div class="error-text" th:errors="*{profesorId}"></div>

      <label class="form-label">Alumno</label>
      <select class="form-select mb-3" th:field="*{alumnoId}">
        <option value="">Seleccionar</option>
        <option th:each="a : ${alumnos}" th:value="${a.id}" th:text="${a.nombre + ' ' + a.apellido}"></option>
      </select>
      <div class="error-text" th:errors="*{alumnoId}"></div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" th:href="@{/gestion/materias}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body></html>
