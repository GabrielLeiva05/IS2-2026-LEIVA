<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alumnos | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold">Alumnos</h1>
      <p class="text-muted mb-0">Registrar, editar, dar de baja y asignar aulas.</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/gestion/alumno/nuevo}">Nuevo alumno</a>
      <a class="btn btn-outline-secondary" th:href="@{/gestion}">&larr; Volver a gestión</a>
    </div>
  </div>

  <div class="card p-4">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Nombre</th><th>Fecha nacimiento</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody>
          <tr th:each="a : ${alumnos}">
            <td th:text="${a.nombre + ' ' + a.apellido}"></td>
            <td th:text="${a.fechaNacimiento}"></td>
            <td>
              <span class="badge bg-success" th:unless="${a.eliminado}">Activo</span>
              <span class="badge bg-secondary" th:if="${a.eliminado}">Dado de baja</span>
            </td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary" th:href="@{'/gestion/alumno/' + ${a.id} + '/editar'}">Editar</a>
              <a class="btn btn-sm btn-outline-secondary" th:href="@{'/admin/auditoria/alumno/' + ${a.id}}">Auditoría</a>
              <form class="d-inline" th:if="${!a.eliminado}" th:action="@{'/gestion/alumno/' + ${a.id} + '/eliminar'}" method="post"
                    onsubmit="return confirm('¿Dar de baja a este alumno?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(alumnos)}"><td colspan="4" class="text-muted text-center">Todavía no hay alumnos registrados.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body></html>
