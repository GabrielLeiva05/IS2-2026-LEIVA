<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nueva aula</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="card p-4"><h1 class="h4">Nueva aula</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/gestion/aula}" th:object="${aula}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">División</label><input class="form-control mb-3" th:field="*{division}"><div class="error-text" th:errors="*{division}"></div><label class="form-label">Grado</label><select class="form-select" th:field="*{gradoId}"><option value="">Seleccionar</option><option th:each="g : ${grados}" th:value="${g.id}" th:text="${g.nivel}"></option></select><div class="error-text" th:errors="*{gradoId}"></div><div class="d-flex gap-2 mt-3"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/gestion/grados}">Cancelar</a></div></form></div></main></body></html>
