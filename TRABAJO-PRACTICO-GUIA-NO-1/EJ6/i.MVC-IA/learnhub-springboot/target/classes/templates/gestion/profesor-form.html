<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar profesor | LearnHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container py-5">
  <div class="card p-4">
    <h1 class="h4">Editar profesor</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{'/gestion/profesor/' + ${profesorId} + '/editar'}" th:object="${form}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}"><div class="error-text" th:errors="*{nombre}"></div></div>
        <div class="col-md-6"><label class="form-label">Apellido</label><input class="form-control" th:field="*{apellido}"><div class="error-text" th:errors="*{apellido}"></div></div>
        <div class="col-md-6"><label class="form-label">Especialidad</label><input class="form-control" th:field="*{especialidad}"><div class="error-text" th:errors="*{especialidad}"></div></div>
        <div class="col-md-6"><label class="form-label">Sexo</label><select class="form-select" th:field="*{sexo}"><option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option></select></div>
        <div class="col-md-6"><label class="form-label">Fecha de nacimiento</label><input class="form-control" type="date" th:field="*{fechaNacimiento}"><div class="error-text" th:errors="*{fechaNacimiento}"></div></div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary">Guardar cambios</button>
        <a class="btn btn-outline-secondary" th:href="@{/gestion/profesores}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body></html>
