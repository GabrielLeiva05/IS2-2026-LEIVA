<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nuevo grado</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments :: navbar}"></div><main class="container py-5"><div class="card p-4"><h1 class="h4">Nuevo grado</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/gestion/grado}" th:object="${grado}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="form-control" th:field="*{nivel}" placeholder="Ej. 1° año"><div class="error-text" th:errors="*{nivel}"></div><div class="d-flex gap-2 mt-3"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/gestion/grados}">Cancelar</a></div></form></div></main></body></html>
