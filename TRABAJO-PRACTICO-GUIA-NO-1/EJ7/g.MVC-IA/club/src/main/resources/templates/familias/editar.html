<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Editar familia')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container narrow"><div th:replace="~{fragments/header :: messages}"></div><h1>Editar familia</h1><form class="form" th:action="@{/familias/{id}/editar(id=${familia.id})}" method="post"><label>Nombre<input name="nombre" th:value="${form.nombre}" required></label><label>Cuota mensual<input type="number" name="cuotaMensual" min="0.01" step="0.01" th:value="${form.cuotaMensual}" required></label><div class="actions"><button class="btn" type="submit">Guardar cambios</button><a class="btn secondary" th:href="@{/familias/{id}(id=${familia.id})}">Cancelar</a></div></form></main></body></html>
