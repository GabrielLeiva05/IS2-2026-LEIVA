<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/header :: head('Detalle del socio')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container"><div th:replace="~{fragments/header :: messages}"></div>
<div class="page-title"><div><h1 th:text="${socio.nombre + ' ' + socio.apellido}">Socio</h1><p th:text="${socio.estado}"></p></div><div class="actions"><a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/socios/{id}/editar(id=${socio.id})}">Editar</a><a class="btn secondary" th:href="@{/socios}">Volver</a></div></div>
<div class="detail-grid"><section class="panel"><h2>Datos personales</h2><dl><dt>Email</dt><dd th:text="${socio.email}"></dd><dt>Teléfono</dt><dd th:text="${socio.telefono}"></dd><dt>Fecha de nacimiento</dt><dd th:text="${socio.fechaNacimiento}"></dd><dt>Fecha de alta</dt><dd th:text="${socio.fechaAlta}"></dd><dt>Familia</dt><dd><span th:if="${socio.familiaId == null}">Sin familia</span><a th:if="${socio.familiaId != null}" th:href="@{/familias/{id}(id=${socio.familiaId})}" th:text="${socio.familiaNombre}"></a></dd></dl></section>
<section class="panel"><h2>Imagen</h2><img th:if="${socio.tieneImagen}" class="avatar" th:src="@{'/personas/' + ${socio.id} + '/imagen'}" alt="Imagen del socio"><p th:if="${!socio.tieneImagen}" class="muted">Sin imagen.</p><form sec:authorize="hasRole('ADMIN')" class="form" th:action="@{'/socios/' + ${socio.id} + '/imagen'}" method="post" enctype="multipart/form-data"><label>Seleccionar imagen<input type="file" name="archivo" accept="image/jpeg,image/png,image/webp" required></label><button class="btn" type="submit">Guardar imagen</button></form><form sec:authorize="hasRole('ADMIN')" th:if="${socio.tieneImagen}" th:action="@{'/socios/' + ${socio.id} + '/imagen/eliminar'}" method="post"><button class="btn danger" type="submit">Eliminar imagen</button></form></section></div>
</main></body></html>
