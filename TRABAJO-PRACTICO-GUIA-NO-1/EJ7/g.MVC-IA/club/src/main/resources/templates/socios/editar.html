<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Editar socio')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container narrow"><div th:replace="~{fragments/header :: messages}"></div><h1>Editar socio</h1><form class="form" th:action="@{/socios/{id}/editar(id=${socio.id})}" method="post"><label>Nombre<input name="nombre" th:value="${form.nombre}" required minlength="2"></label><label>Apellido<input name="apellido" th:value="${form.apellido}" required minlength="2"></label><label>Email<input type="email" name="email" th:value="${form.email}" required></label><label>Teléfono<input name="telefono" th:value="${form.telefono}" required></label><label>Fecha de nacimiento<input type="date" name="fechaNacimiento" th:value="${form.fechaNacimiento}" required></label><div class="actions"><button class="btn" type="submit">Guardar cambios</button><a class="btn secondary" th:href="@{/socios/{id}(id=${socio.id})}">Cancelar</a></div></form></main></body></html>
