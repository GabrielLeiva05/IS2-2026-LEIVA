<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/header :: head('Pagos')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container"><div th:replace="~{fragments/header :: messages}"></div><div class="page-title"><div><h1>Pagos de cuotas</h1><p>Historial de cuotas por grupo familiar.</p></div><a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/pagos/nuevo}">+ Registrar pago</a></div><div class="table-wrap"><table><thead><tr><th>Familia</th><th>Período</th><th>Importe</th><th>Medio</th><th>Referencia</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="p : ${pagos}"><td><a th:href="@{/familias/{id}(id=${p.familiaId})}" th:text="${p.familiaNombre}"></a></td><td th:text="${p.periodo}"></td><td th:text="${'$ ' + p.importe}"></td><td th:text="${p.medioPago}"></td><td th:text="${p.referencia != null ? p.referencia : '-'}"></td><td th:text="${p.fechaPago}"></td><td th:text="${p.estado}"></td><td><form sec:authorize="hasRole('ADMIN')" th:if="${p.estado.name() == 'REGISTRADO'}" th:action="@{/pagos/{id}/anular(id=${p.id})}" method="post"><button class="btn danger small" type="submit">Anular</button></form></td></tr><tr th:if="${#lists.isEmpty(pagos)}"><td colspan="8" class="empty">No hay pagos registrados.</td></tr></tbody></table></div></main></body></html>
