<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/header :: head('Accesos')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container"><div th:replace="~{fragments/header :: messages}"></div><div class="page-title"><div><h1>Registro de accesos</h1><p>Registrar entradas y salidas del club.</p></div></div><section sec:authorize="hasRole('ADMIN')" class="panel"><h2>Registrar entrada</h2><form class="inline-form" th:action="@{/accesos/entrada}" method="post"><select name="personaId" required><option value="">Seleccione una persona...</option><option th:each="p : ${personas}" th:value="${p.id}" th:text="${p.nombre + ' ' + p.apellido}"></option></select><button class="btn" type="submit">Registrar entrada</button></form></section><div class="table-wrap"><table><thead><tr><th>Persona</th><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Duración</th><th>Acción</th></tr></thead><tbody><tr th:each="a : ${accesos}"><td th:text="${a.personaNombre}"></td><td th:text="${a.fecha}"></td><td th:text="${a.horaEntrada}"></td><td th:text="${a.horaSalida != null ? a.horaSalida : 'Abierta'}"></td><td th:text="${a.horaSalida != null ? a.duracionMinutos + ' min' : '-'}"></td><td><form sec:authorize="hasRole('ADMIN')" th:if="${a.horaSalida == null}" th:action="@{/accesos/{id}/salida(id=${a.id})}" method="post"><button class="btn small" type="submit">Registrar salida</button></form></td></tr><tr th:if="${#lists.isEmpty(accesos)}"><td colspan="6" class="empty">No hay accesos registrados.</td></tr></tbody></table></div></main></body></html>
