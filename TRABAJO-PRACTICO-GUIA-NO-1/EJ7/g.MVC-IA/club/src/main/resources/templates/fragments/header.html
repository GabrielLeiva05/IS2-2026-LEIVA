<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title} + ' | Club Gestión'">Club Gestión</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:fragment="nav" class="topbar"><div class="brand"><a th:href="@{/}">Club Gestión</a></div><nav><a th:href="@{/}">Inicio</a><a th:href="@{/socios}">Socios</a><a th:href="@{/familias}">Familias</a><a th:href="@{/pagos}">Pagos</a><a th:href="@{/accesos}">Accesos</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/auditoria}">Auditoría</a></nav><div class="session"><span sec:authentication="name"></span><span class="badge" sec:authorize="hasRole('ADMIN')">ADMIN</span><span class="badge" sec:authorize="hasRole('USER')">USER</span><form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Salir</button></form></div></header><div th:fragment="messages" class="messages"><div th:if="${ok}" class="alert success" th:text="${ok}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div></div></body></html>
