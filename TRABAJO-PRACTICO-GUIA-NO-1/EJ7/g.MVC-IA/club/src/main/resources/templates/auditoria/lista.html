<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Auditoría')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container"><div th:replace="~{fragments/header :: messages}"></div><div class="page-title"><div><h1>Auditoría</h1><p>Revisiones registradas por Hibernate Envers y usuario autenticado.</p></div></div><div class="table-wrap"><table><thead><tr><th>Revisión</th><th>Fecha</th><th>Usuario</th></tr></thead><tbody><tr th:each="r : ${revisiones}"><td th:text="${r.id}"></td><td th:text="${r.fecha}"></td><td th:text="${r.usuario}"></td></tr><tr th:if="${#lists.isEmpty(revisiones)}"><td colspan="3" class="empty">No hay revisiones todavía.</td></tr></tbody></table></div></main></body></html>
