<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Nueva familia')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container narrow"><div th:replace="~{fragments/header :: messages}"></div><h1>Nueva familia</h1><form class="form" th:action="@{/familias}" method="post"><label>Nombre de la familia<input name="nombre" th:value="${form.nombre}" required></label><label>Cuota mensual<input type="number" name="cuotaMensual" min="0.01" step="0.01" th:value="${form.cuotaMensual}" required></label><label>Socio titular<select name="titularId" required><option value="">Seleccione...</option><option th:each="s : ${socios}" th:value="${s.id}" th:selected="${s.id == form.titularId}" th:text="${s.nombre + ' ' + s.apellido}"></option></select></label><div class="actions"><button class="btn" type="submit">Guardar</button><a class="btn secondary" th:href="@{/familias}">Cancelar</a></div></form></main></body></html>
