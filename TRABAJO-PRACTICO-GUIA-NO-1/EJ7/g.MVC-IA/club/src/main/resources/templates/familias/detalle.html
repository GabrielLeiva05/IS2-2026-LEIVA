<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/header :: head('Detalle familia')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container"><div th:replace="~{fragments/header :: messages}"></div>
<div class="page-title"><div><h1 th:text="${familia.nombre}">Familia</h1><p>Cuota mensual: <strong th:text="${'$ ' + familia.cuotaMensual}"></strong></p></div><div class="actions"><a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/pagos/nuevo(familiaId=${familia.id})}">Registrar pago</a><a sec:authorize="hasRole('ADMIN')" class="btn secondary" th:href="@{/familias/{id}/editar(id=${familia.id})}">Editar</a></div></div>
<div class="detail-grid"><section class="panel"><h2>Integrantes</h2><p><strong>Titular:</strong> <span th:text="${familia.titular.nombre + ' ' + familia.titular.apellido}"></span></p><table><thead><tr><th>Persona</th><th>Tipo</th><th></th></tr></thead><tbody><tr th:each="p : ${familia.familiares}"><td th:text="${p.nombre + ' ' + p.apellido}"></td><td th:text="${p.id == familia.titular.id ? 'Titular' : 'Familiar'}"></td><td><form sec:authorize="hasRole('ADMIN')" th:if="${p.id != familia.titular.id}" th:action="@{/familias/{id}/familiares/{pid}/eliminar(id=${familia.id},pid=${p.id})}" method="post"><button class="btn danger small" type="submit">Quitar</button></form></td></tr></tbody></table>
<h3 sec:authorize="hasRole('ADMIN')">Agregar integrante</h3><form sec:authorize="hasRole('ADMIN')" class="inline-form" th:action="@{/familias/{id}/familiares(id=${familia.id})}" method="post"><select name="personaId" required><option value="">Seleccione una persona...</option><option th:each="p : ${personasDisponibles}" th:if="${p.familiaId == null}" th:value="${p.id}" th:text="${p.nombre + ' ' + p.apellido}"></option></select><button class="btn" type="submit">Agregar</button></form></section>
<section class="panel"><h2>Historial de pagos</h2><table><thead><tr><th>Período</th><th>Importe</th><th>Medio</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="p : ${pagos}"><td th:text="${p.periodo}"></td><td th:text="${'$ ' + p.importe}"></td><td th:text="${p.medioPago}"></td><td th:text="${p.fechaPago}"></td><td th:text="${p.estado}"></td><td><form sec:authorize="hasRole('ADMIN')" th:if="${p.estado.name() == 'REGISTRADO'}" th:action="@{/pagos/{id}/anular(id=${p.id})}" method="post"><button class="btn danger small" type="submit">Anular</button></form></td></tr><tr th:if="${#lists.isEmpty(pagos)}"><td colspan="6" class="empty">No hay pagos registrados.</td></tr></tbody></table></section></div>
<section sec:authorize="hasRole('ADMIN')" class="panel danger-zone"><h2>Eliminar familia</h2><p>Solo se permite si no existen pagos registrados.</p><form th:action="@{/familias/{id}/eliminar(id=${familia.id})}" method="post"><button class="btn danger" type="submit">Eliminar familia</button></form></section>
</main></body></html>
