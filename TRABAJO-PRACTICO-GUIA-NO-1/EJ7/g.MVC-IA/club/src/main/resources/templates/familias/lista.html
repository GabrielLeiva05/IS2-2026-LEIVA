<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/header :: head('Familias')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container"><div th:replace="~{fragments/header :: messages}"></div>
<div class="page-title"><div><h1>Grupos familiares</h1><p>Una familia administra una cuota mensual y puede tener varios integrantes.</p></div><a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/familias/nuevo}">+ Nueva familia</a></div>
<div class="table-wrap"><table><thead><tr><th>Familia</th><th>Titular</th><th>Cuota mensual</th><th>Integrantes</th><th>Acciones</th></tr></thead><tbody><tr th:each="f : ${familias}"><td><a th:href="@{/familias/{id}(id=${f.id})}" th:text="${f.nombre}"></a></td><td th:text="${f.titularNombre}"></td><td th:text="${'$ ' + f.cuotaMensual}"></td><td th:text="${f.cantidadFamiliares}"></td><td><a class="btn small" th:href="@{/familias/{id}(id=${f.id})}">Ver</a><a sec:authorize="hasRole('ADMIN')" class="btn small secondary" th:href="@{/familias/{id}/editar(id=${f.id})}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(familias)}"><td colspan="5" class="empty">No hay familias registradas.</td></tr></tbody></table></div></main></body></html>
