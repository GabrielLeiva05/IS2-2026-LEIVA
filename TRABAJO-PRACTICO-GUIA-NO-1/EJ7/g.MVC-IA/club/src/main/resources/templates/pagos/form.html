<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Registrar pago')}"></head><body><header th:replace="~{fragments/header :: nav}"></header><main class="container narrow"><div th:replace="~{fragments/header :: messages}"></div><h1>Registrar pago de cuota</h1><p class="muted">Una familia solo puede tener un pago por período.</p><form class="form" th:action="@{/pagos}" method="post"><label>Familia<select name="familiaId" required><option value="">Seleccione...</option><option th:each="f : ${familias}" th:value="${f.id}" th:selected="${f.id == familiaIdSeleccionada}" th:text="${f.nombre + ' — cuota $' + f.cuotaMensual}"></option></select></label><label>Período<input type="month" name="periodo" th:value="${form.periodo}" required></label><label>Importe<input type="number" name="importe" min="0.01" step="0.01" th:value="${form.importe}" required></label><label>Medio de pago<select name="medioPago" required><option value="">Seleccione...</option><option th:each="m : ${medioPagos}" th:value="${m}" th:text="${m}"></option></select></label><label>Referencia <span class="muted">(obligatoria para transferencia/Mercado Pago)</span><input name="referencia" th:value="${form.referencia}"></label><div class="actions"><button class="btn" type="submit">Registrar pago</button><a class="btn secondary" th:href="@{/pagos}">Cancelar</a></div></form></main></body></html>
