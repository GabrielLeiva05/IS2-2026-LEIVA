<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(titulo='Productos')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 px-0" th:replace="~{layout/base :: sidebar(activo='productos')}"></div>
        <div class="col-lg-10 col-md-9 px-0">
            <div th:replace="~{layout/base :: topbar(titulo='Productos')}"></div>
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <form th:action="@{/productos}" method="get" class="d-flex gap-2">
                        <input type="text" name="buscar" th:value="${buscar}" class="form-control form-control-sm"
                               placeholder="Buscar por nombre..." style="width:220px;"/>
                        <button type="submit" class="btn btn-sm btn-outline-dark"><i class="bi bi-search"></i></button>
                    </form>
                    <a th:href="@{/productos/nuevo}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg"></i> Nuevo producto
                    </a>
                </div>

                <div class="table-responsive card border-0 shadow-sm">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Categoría</th>
                            <th>Stock actual</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.id}">1</td>
                            <td th:text="${p.nombre}">Producto</td>
                            <td th:text="${p.marca}">Marca</td>
                            <td th:text="${p.categoria}">Categoría</td>
                            <td>
                                <span class="badge bg-dark" th:text="${stockPorProducto.get(p.id)}">0</span>
                                <a th:href="@{/stock/historial/{id}(id=${p.id})}" class="small ms-1">ver historial</a>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-dark">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/productos/eliminar/{id}(id=${p.id})}" method="post" class="d-inline"
                                      th:attr="onsubmit=|return confirm('¿Eliminar el producto &quot;${p.nombre}&quot;?');|">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="6" class="text-center text-muted py-4">No hay productos cargados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
