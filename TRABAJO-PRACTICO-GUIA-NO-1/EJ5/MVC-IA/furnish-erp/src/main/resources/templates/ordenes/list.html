<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(titulo='Órdenes de Compra')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 px-0" th:replace="~{layout/base :: sidebar(activo='ordenes')}"></div>
        <div class="col-lg-10 col-md-9 px-0">
            <div th:replace="~{layout/base :: topbar(titulo='Órdenes de Compra')}"></div>
            <div th:replace="~{layout/base :: flash}"></div>

            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small" th:text="${#lists.size(ordenes)} + ' orden(es) registrada(s)'"></span>
                    <a th:href="@{/ordenes/nueva}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg"></i> Nueva orden de compra
                    </a>
                </div>

                <div class="table-responsive card border-0 shadow-sm">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Fecha</th>
                            <th>Proveedor</th>
                            <th>Empleado</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="o : ${ordenes}">
                            <td th:text="${o.idOrdenCompra}">1</td>
                            <td th:text="${#temporals.format(o.fechaEmision, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td th:text="${o.proveedor.nombre}">Proveedor</td>
                            <td th:text="${o.empleado.nombre}">Empleado</td>
                            <td th:text="${'$' + #numbers.formatDecimal(o.precioTotal, 1, 2)}">$0.00</td>
                            <td>
                                <span class="badge" th:classappend="'badge-estado-' + ${o.estado}" th:text="${o.estado}">PENDIENTE</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/ordenes/ver/{id}(id=${o.idOrdenCompra})}" class="btn btn-sm btn-outline-dark">
                                    <i class="bi bi-eye"></i> Ver
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ordenes)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay órdenes de compra registradas.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
