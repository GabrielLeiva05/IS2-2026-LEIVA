<!DOCTYPE html>
<html>
    <head>
        <title>Lista de Productos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
            }

            body {
                min-height: 100vh;
                padding: 50px 20px;
                background: linear-gradient(135deg, #667eea, #764ba2);
            }

            .contenedor {
                width: 100%;
                max-width: 1000px;
                margin: auto;
            }

            .tarjeta {
                background-color: white;
                padding: 35px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            }

            h1 {
                text-align: center;
                color: #333;
                margin-bottom: 30px;
                font-size: 32px;
            }

            .tabla-contenedor {
                overflow-x: auto;
                border-radius: 10px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                overflow: hidden;
            }

            thead {
                background: linear-gradient(135deg, #667eea, #764ba2);
            }

            th {
                padding: 16px;
                color: white;
                text-align: left;
                font-size: 15px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            td {
                padding: 16px;
                border-bottom: 1px solid #eeeeee;
                color: #444;
                font-size: 15px;
            }

            tbody tr {
                transition: all 0.2s ease;
            }

            tbody tr:hover {
                background-color: #f5f6ff;
                transform: scale(1.01);
            }

            tbody tr:last-child td {
                border-bottom: none;
            }

            td:first-child {
                font-weight: bold;
                color: #667eea;
            }

            td:last-child {
                font-weight: bold;
                color: #764ba2;
            }

            @media (max-width: 600px) {

                .tarjeta {
                    padding: 20px;
                }

                h1 {
                    font-size: 25px;
                }

                th,
                td {
                    padding: 12px 10px;
                    font-size: 14px;
                }
            }
        </style>
    </head>

    <body>
        <div th:replace='~{fragments::header}'></div>
        <div class="contenedor">

            <div class="tarjeta">

                <h1>Lista de Productos</h1>
                <div th:insert='~{fragments::msj}'></div>
                <div class="tabla-contenedor">

                    <table>

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Marca</th>
                                <th>Precio</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="producto : ${listaProductos}">
                                <td th:text="${producto.id}"></td>
                                <td th:text="${producto.nombre}"></td>
                                <td th:text="${producto.marca}"></td>
                                <td th:text="${producto.precio}"></td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>
        <div th:replace='~{fragments::footer}'></div>
    </body>
</html>
