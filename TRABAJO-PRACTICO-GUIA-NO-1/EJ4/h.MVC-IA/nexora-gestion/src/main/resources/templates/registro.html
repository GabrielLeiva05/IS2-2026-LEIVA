<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('registro')}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>

<section class="section bg-soft" style="min-height: 60vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-9">
        <div class="p-4 p-md-5 rounded-3" style="background: var(--n-white); box-shadow: var(--n-shadow-md); border: 1px solid var(--n-border);">
          <span class="eyebrow">Sumate a Nexora</span>
          <h2 class="section-title mb-4">Crear cuenta de Usuario</h2>

          <div class="alert alert-danger" th:if="${mensajeError != null}" th:text="${mensajeError}">Error</div>

          <!-- th:object vincula el formulario al DTO RegistroUsuarioForm.
               El Controller (AuthController.procesarRegistro) valida con
               @Valid y delega el alta real en UsuarioService.registrar(),
               que es quien hashea la contraseña y valida correo duplicado. -->
          <form th:action="@{/registro}" th:object="${registroForm}" method="post" class="needs-validation" novalidate>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold text-navy">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-navy">Apellido</label>
                <input type="text" class="form-control" th:field="*{apellido}" placeholder="Apellido">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold text-navy">Documento</label>
                <input type="number" class="form-control" th:field="*{documento}" placeholder="12345678">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-navy">Fecha de nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaDeNacimiento}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fechaDeNacimiento')}" th:errors="*{fechaDeNacimiento}"></div>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold text-navy">Correo electrónico</label>
                <input type="email" class="form-control" th:field="*{correo}" placeholder="tu@correo.com">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold text-navy">Contraseña</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="Mínimo 6 caracteres">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg-custom w-100 mt-4">Crear cuenta</button>
          </form>

          <p class="text-center text-slate mt-4 mb-0">
            ¿Ya tenés cuenta? <a th:href="@{/login}" class="fw-semibold">Iniciá sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
