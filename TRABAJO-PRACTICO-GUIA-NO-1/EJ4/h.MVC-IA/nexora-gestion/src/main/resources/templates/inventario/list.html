<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventario')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin-inventario')}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>

<section class="section">
  <div class="container">
    <div class="row section-header align-items-end">
      <div class="col-lg-7">
        <span class="eyebrow">Panel de administración</span>
        <h2 class="section-title">Inventario</h2>
        <p class="section-subtitle">Historial de movimientos de stock (entradas y salidas) de todos los productos.</p>
      </div>
      <div class="col-lg-5 text-lg-end mt-3 mt-lg-0">
        <a th:href="@{/admin/inventario/nuevo}" class="btn btn-primary btn-lg-custom">
          <i class="bi bi-plus-lg me-1"></i>Registrar movimiento
        </a>
      </div>
    </div>

    <div class="table-responsive rounded-3" style="border: 1px solid var(--n-border);">
      <table class="table align-middle mb-0">
        <thead style="background: var(--n-bg-alt);">
          <tr>
            <th>Fecha</th>
            <th>Producto</th>
            <th>Tipo</th>
            <th>Cantidad</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="mov : ${movimientos}">
            <td class="text-slate" th:text="${#temporals.format(mov.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
            <td class="fw-semibold text-navy" th:text="${mov.producto.nombre}">Producto</td>
            <td>
              <span th:if="${mov.tipoMovimiento.name() == 'ENTRADA'}" class="badge-soft" style="color: var(--n-success);">
                <i class="bi bi-arrow-down-circle me-1"></i>Entrada
              </span>
              <span th:if="${mov.tipoMovimiento.name() == 'SALIDA'}" class="badge-soft" style="color: #B42318;">
                <i class="bi bi-arrow-up-circle me-1"></i>Salida
              </span>
            </td>
            <td th:text="${mov.cantidad}">0</td>
          </tr>
          <tr th:if="${#lists.isEmpty(movimientos)}">
            <td colspan="4" class="text-center text-slate py-4">Todavía no hay movimientos registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
