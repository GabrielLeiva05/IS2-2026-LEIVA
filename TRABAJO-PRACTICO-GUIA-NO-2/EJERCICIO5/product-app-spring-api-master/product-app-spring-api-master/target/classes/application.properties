spring.application.name=product-app
server.port=${PORT:8080}

# ==========================================
# Configuración de Base de Datos MySQL
# ==========================================
# URL parametrizada: crea la BD si no existe y define la zona horaria de Argentina
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productdbej5}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Variables de entorno con valor por defecto 'root'
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ==========================================
# Configuración JPA / Hibernate
# ==========================================
# 'update' mantiene los datos y crea/modifica tablas según cambien tus entidades.
# Cambia a 'create' solo si necesitas borrar y recrear las tablas cada vez que inicia la app.
spring.jpa.hibernate.ddl-auto=create-drop

# Muestra y formatea las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Retarda la ejecución de data.sql hasta que Hibernate haya creado/actualizado la estructura de las tablas
spring.jpa.defer-datasource-initialization=true

# ==========================================
# Inicialización de datos SQL (Spring Boot 2.5+)
# ==========================================
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
